header:
  version: 19

local_conf_header:
  image-from-feeds: |
    BUILD_IMAGES_FROM_FEEDS = "1"
    # Base URI for local OE feed content consumed during image assembly.
    # Override this for stage-2 builds that consume prebuilt feed exports.
    NILE_LOCAL_FEED_URI ?= "file://${DEPLOY_DIR_IPK}"

    # Feed URI consumed by opkg during do_rootfs when BUILD_IMAGES_FROM_FEEDS=1.
    # Expected format for IPK_FEED_URIS entries is <feed-name>##<feed-uri>.
    IPK_FEED_URIS += " \
      NILE-all##${NILE_LOCAL_FEED_URI}/all \
      NILE-${MACHINE}##${NILE_LOCAL_FEED_URI}/${MACHINE} \
      NILE-${TUNE_PKGARCH}##${NILE_LOCAL_FEED_URI}/${TUNE_PKGARCH} \
    "

    # Populate runtime feed config generation for package-management images.
    PACKAGE_FEED_URIS ?= "${NILE_LOCAL_FEED_URI}"
    PACKAGE_FEED_ARCHS ?= "all ${MACHINE} ${TUNE_PKGARCH}"
