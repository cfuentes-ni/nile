name: Trigger AzDO PR pipeline

on:
  workflow_dispatch:
  pull_request:


jobs:
  trigger-azdo-tests:
    runs-on: ubuntu-latest
    environment: ni-dev
    steps:
      - name: Set variables for PR run
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "BUILD_REF=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          echo "REPO_URL=${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name }}.git" >> $GITHUB_ENV
          echo "____________________________________"
          echo "MERGE_PR=true" >> $GITHUB_ENV
          echo "BASE_REPO_URL=${{ github.server_url }}/${{ github.repository }}.git" >> $GITHUB_ENV
          echo "BASE_REF=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
          echo "HEAD_REPO_URL=${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name }}.git" >> $GITHUB_ENV
          echo "HEAD_REF=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
      - name: Set variables for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "BUILD_REF=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "REPO_URL=${{ github.server_url }}/${{ github.repository }}.git" >> $GITHUB_ENV
          echo "____________________________________"
          echo "MERGE_PR=false" >> $GITHUB_ENV
          echo "BASE_REPO_URL=${{ github.server_url }}/${{ github.repository }}.git" >> $GITHUB_ENV
          echo "BASE_REF=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "HEAD_REPO_URL=" >> $GITHUB_ENV
          echo "HEAD_REF=" >> $GITHUB_ENV
          echo "HEAD_SHA=" >> $GITHUB_ENV
      - name: Trigger Main
        id: trigger_step
        uses: Azure/pipelines@v1.2
        with:
          azure-devops-project-url: "https://dev.azure.com/ni/Users"
          azure-pipeline-name: "cfuentes-pipelines"
          azure-devops-token: ${{ secrets.CFC_TOKEN }}
          wait-for-completion: true
          azure-pipeline-variables: >
            {"BUILD_REF":"${{ env.BUILD_REF }}","REPO_URL":"${{ env.REPO_URL }}"}
      - name: Dump trigger step
        run: |
          echo '${{ toJson(steps.trigger_step) }}'

      - name: Wait for Azure Pipeline
        run: |
          URL="${{ steps.trigger_step.outputs.pipeline-url }}"
          RUN_ID=$(echo "$URL" | grep -oP 'buildId=\K[0-9]+')
          echo "Run ID: $RUN_ID"

          while true; do
            response=$(curl -s \
              -u ":${{ secrets.CFC_TOKEN }}" \
              "https://dev.azure.com/ni/Users/_apis/pipelines/123/runs/$RUN_ID?api-version=7.1-preview.1")

            state=$(echo "$response" | jq -r .state)
            result=$(echo "$response" | jq -r .result)

            echo "State=$state Result=$result"

            if [ "$state" = "completed" ]; then
              if [ "$result" = "succeeded" ]; then
                exit 0
              else
                echo "Azure pipeline failed"
                exit 1
              fi
            fi

            sleep 30
          done
